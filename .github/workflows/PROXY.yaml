name: Update PROXY

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  pull-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download and convert gfwlist
        run: |
          python3 -c "
          import urllib.request
          import base64

          url = 'https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt'
          response = urllib.request.urlopen(url)
          content = response.read().decode('utf-8')

          decoded_bytes = base64.b64decode(content)
          lines = decoded_bytes.decode('utf-8', errors='ignore').splitlines()

          domains = set()
          for line in lines:
              line = line.strip()
              if not line or line.startswith('!') or line.startswith('[') or '@' in line:
                  continue
              
              if line.startswith('||'):
                  domain = line[2:]
              elif line.startswith('.'):
                  domain = line[1:]
              elif line.startswith('http://') or line.startswith('https://'):
                  domain = line.split('/')[2]
              else:
                  domain = line

              domain = domain.split('/')[0].split('*')[0]
              if '.' in domain and not domain.replace('.', '').isdigit():
                  domains.add(domain)

          with open('PROXY', 'w', encoding='utf-8') as f:
              for d in sorted(domains):
                  f.write(f'DOMAIN-SUFFIX,{d}\n')
          "

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add PROXY
          git diff --quiet && git diff --staged --quiet || (git commit -m "Pull and convert gfwlist to PROXY at $(date +'%Y-%m-%d %H:%M:%S')" && git push)
